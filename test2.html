
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GTA Mexico: Cartel City — CJ LOW POLY · PLACOSO EDITION</title>
  
  <style>
    /* Reset and base styles */
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      touch-action: none;
      background: #000;
    }
    /* HUD container overlay */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }
    /* Mini map style */
    .minimap-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 170px;
      height: 170px;
      background: rgba(10, 10, 20, 0.85);
      border-radius: 50%;
      border: 3px solid #ffcc44;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      overflow: hidden;
      backdrop-filter: blur(3px);
    }
    #minimapCanvas {
      width: 100%;
      height: 100%;
    }
    /* Status panel styling */
    .status-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 20px;
      min-width: 210px;
      border-right: 3px solid #ffaa33;
    }
    .stat {
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #ddd;
      display: inline-block;
      width: 48px;
    }
    .bar-bg {
      display: inline-block;
      width: 120px;
      height: 14px;
      background: #2c2c2e;
      border-radius: 7px;
      overflow: hidden;
      margin-left: 8px;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s ease;
    }
    .health-fill {
      background: linear-gradient(90deg, #ff6666, #ff2222);
    }
    .armor-fill {
      background: linear-gradient(90deg, #55aaff, #2277dd);
    }
    .money {
      font-size: 22px;
      font-weight: bold;
      color: #f5b042;
      text-shadow: 0 0 4px black;
      margin-top: 8px;
      text-align: center;
    }
    .placoso-coins {
      font-size: 13px;
      color: #aaffaa;
      text-align: center;
      font-weight: bold;
    }
    .wanted-stars {
      text-align: center;
      letter-spacing: 5px;
      font-size: 20px;
      margin-top: 6px;
    }
    .weapon-panel {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 50px;
      text-align: center;
      border-left: 4px solid #ffaa33;
      min-width: 150px;
    }
    .weapon-name {
      font-size: 15px;
      font-weight: bold;
      color: #ffcc66;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .weapon-ammo {
      font-size: 34px;
      font-weight: 900;
      color: white;
      line-height: 1;
    }
    .mission-text {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: bold;
      color: #ffdd88;
      white-space: nowrap;
      backdrop-filter: blur(5px);
      font-family: monospace;
    }
   
  
    .shoot-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 75px;
      height: 75px;
      background: radial-gradient(circle at 30% 30%, #ff5555, #aa2222);
      border-radius: 50%;
      border: 3px solid white;
      pointer-events: auto;
      cursor: pointer;
    }
    .enter-btn {
      position: absolute;
      bottom: 30px;
      right: 130px;
      width: 60px;
      height: 60px;
      background: #2e7d32;
      border-radius: 50%;
      border: 2px solid white;
      pointer-events: auto;
      display: none;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
      font-size: 18px;
      color: white;
    }
    .aim-btn {
      position: absolute;
      bottom: 130px;
      right: 30px;
      width: 55px;
      height: 55px;
      background: rgba(50,50,80,0.8);
      border-radius: 50%;
      border: 2px solid #ffaa33;
      pointer-events: auto;
      text-align: center;
      line-height: 55px;
      font-size: 16px;
      color: white;
    }
    @media (max-width: 768px) {
      #mobile-controls { display: block; }
      .status-panel { transform: scale(0.85); right: 0; top: 5px; }
      .weapon-panel { bottom: 140px; }
      .mission-text { bottom: 110px; font-size: 10px; white-space: normal; width: 85%; text-align: center; }
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 0 4px rgba(255,255,255,0.3);
      pointer-events: none;
      transition: transform 0.05s;
    }
    .damage-overlay {
      position: fixed;
      inset: 0;
      background: rgba(180, 0, 0, 0);
      pointer-events: none;
      transition: background 0.08s;
      z-index: 60;
    }
  </style>
</head>
<body>
<div id="hud">
  <div class="minimap-container">
    <canvas id="minimapCanvas" width="170" height="170"></canvas>
  </div>
  <div class="status-panel">
    <div class="stat"><span class="stat-label">❤️ HP</span>
      <div class="bar-bg"><div class="bar-fill health-fill" id="healthFill" style="width:100%"></div></div>
    </div>
    <div class="stat"><span class="stat-label">🛡️ ARM</span>
      <div class="bar-bg"><div class="bar-fill armor-fill" id="armorFill" style="width:100%"></div></div>
    </div>
    <div class="money" id="moneyDisplay">💰 8000</div>
    <div class="placoso-coins" id="coinDisplay">🪙 PLACOSO: 12</div>
    <div class="wanted-stars" id="wantedStars">⭐</div>
  </div>
  <div class="weapon-panel">
    <div class="weapon-name" id="weaponName">PISTOL</div>
    <div class="weapon-ammo" id="weaponAmmo">30/30</div>
  </div>
  <div class="mission-text" id="missionText">🚗 CJ LOW POLY | DRIVE / KILL CARTEL | YELLOW = PLACOSO STORE</div>
  <div id="crosshair"></div>
  <div id="damageFlash" class="damage-overlay"></div>
</div>
<div id="app">
  <div id="crosshair"></div>
  <div id="hud">…</div>

  <div class="pad" id="movePad">
    <div class="knob"></div>
    <div class="label">MOVE</div>
  </div>

  <div class="pad" id="lookPad">
    <div class="knob"></div>
    <div class="label">LOOK</div>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>

<script type="module">
  import * as THREE from 'three';

  // --- SCENE SETUP ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1f2a);
  scene.fog = new THREE.FogExp2(0x0a1f2a, 0.0025);
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // --- LIGHTS ---
  const ambient = new THREE.AmbientLight(0x505078, 0.7);
  scene.add(ambient);
  const sunLight = new THREE.DirectionalLight(0xffdd99, 1.2);
  sunLight.position.set(40, 70, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  scene.add(sunLight);
  const backLight = new THREE.PointLight(0x6688cc, 0.5);
  backLight.position.set(0, 12, 0);
  scene.add(backLight);

  // --- GROUND ---
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a6a3a, roughness: 0.9 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(380, 380), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.7;
  ground.receiveShadow = true;
  scene.add(ground);

  // --- CITY BLOCKS (LOW POLY)---
  const blockColors = [0xc97e5a, 0xe0ac69, 0xbd8a5a, 0x8b5a2b, 0xa56b3a, 0x5d8c6b, 0xcd8d6a];
  const blockSize = 4.3;
  const range = 20;
  for (let i = -range; i <= range; i++) {
    for (let j = -range; j <= range; j++) {
      if (Math.abs(i) <= 4 && Math.abs(j) <= 4) continue;
      if (Math.random() > 0.7) continue;
      const w = 1.2 + Math.random() * 2.0;
      const d = 1.2 + Math.random() * 2.0;
      const h = 2.0 + Math.random() * 7.0;
      const building = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: blockColors[Math.floor(Math.random() * blockColors.length)], roughness: 0.5 })
      );
      building.position.set(i * blockSize, h / 2, j * blockSize);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
      const roof = new THREE.Mesh(
        new THREE.CylinderGeometry(w * 0.7, w * 0.8, 0.25, 4),
        new THREE.MeshStandardMaterial({ color: 0xaa6e4a })
      );
      roof.position.set(i * blockSize, h, j * blockSize);
      scene.add(roof);
    }
  }

  // --- ROADS ---
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
  for (let k = -22; k <= 22; k++) {
    const roadX = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.12, 280), roadMat);
    roadX.position.set(k * 4.5, -0.52, 0);
    roadX.receiveShadow = true;
    scene.add(roadX);
    const roadZ = new THREE.Mesh(new THREE.BoxGeometry(280, 0.12, 4.0), roadMat);
    roadZ.position.set(0, -0.52, k * 4.5);
    roadZ.receiveShadow = true;
    scene.add(roadZ);
  }

  // --- STORE (PLACOSO) ---
  const storePos = new THREE.Vector3(22, 0, 24);
  const storeBase = new THREE.Mesh(
    new THREE.BoxGeometry(2.6, 2.8, 2.6),
    new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0x331d00 })
  );
  storeBase.position.copy(storePos);
  storeBase.castShadow = true;
  scene.add(storeBase);
  const storeSign = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xffdd77 }));
  storeSign.position.set(storePos.x, storePos.y + 1.5, storePos.z + 1.3);
  scene.add(storeSign);

  // --- PLAYER MODEL (CJ) ---
  const playerGroup = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.78, 1.05, 0.58), new THREE.MeshStandardMaterial({ color: 0xf5f5dc }));
  torso.position.y = 0.55; torso.castShadow = true;
  playerGroup.add(torso);
  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.7, 0.65), new THREE.MeshStandardMaterial({ color: 0x2c5f8a }));
  hips.position.y = 0.2; hips.castShadow = true;
  playerGroup.add(hips);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 20), new THREE.MeshStandardMaterial({ color: 0xbc9a6c }));
  head.position.y = 1.18; head.castShadow = true;
  playerGroup.add(head);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  eyeL.position.set(-0.16, 1.32, 0.48); playerGroup.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  eyeR.position.set(0.16, 1.32, 0.48); playerGroup.add(eyeR);
  const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshStandardMaterial({ color: 0x000000 }));
  pupilL.position.set(-0.16, 1.30, 0.55); playerGroup.add(pupilL);
  const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshStandardMaterial({ color: 0x000000 }));
  pupilR.position.set(0.16, 1.30, 0.55); playerGroup.add(pupilR);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.82, 0.3), new THREE.MeshStandardMaterial({ color: 0xbc9a6c }));
  leftArm.position.set(-0.62, 0.96, 0); leftArm.castShadow = true;
  playerGroup.add(leftArm);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.82, 0.32), new THREE.MeshStandardMaterial({ color: 0xbc9a6c }));
  rightArm.position.set(0.62, 0.96, 0.25); rightArm.rotation.z = -0.35; rightArm.rotation.x = -0.5; rightArm.castShadow = true;
  playerGroup.add(rightArm);
  const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshStandardMaterial({ color: 0xbc9a6c }));
  rightHand.position.set(0.92, 1.00, 0.58); rightHand.castShadow = true;
  playerGroup.add(rightHand);
  const gunGroup = new THREE.Group();
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.45, 0.2), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7 }));
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.65), new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8 }));
  barrel.position.set(0, 0.05, 0.4);
  const slide = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.35), new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.9 }));
  slide.position.set(0, 0.2, 0.25);
  gunGroup.add(grip, barrel, slide);
  gunGroup.position.copy(rightHand.position);
  gunGroup.position.z += 0.15; gunGroup.position.y -= 0.05;
  gunGroup.rotation.x = -0.2; gunGroup.rotation.z = -0.1;
  playerGroup.add(gunGroup);
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.85, 0.38), new THREE.MeshStandardMaterial({ color: 0x2c5f8a }));
  leftLeg.position.set(-0.3, 0.25, 0); leftLeg.castShadow = true;
  playerGroup.add(leftLeg);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.85, 0.38), new THREE.MeshStandardMaterial({ color: 0x2c5f8a }));
  rightLeg.position.set(0.3, 0.25, 0); rightLeg.castShadow = true;
  playerGroup.add(rightLeg);
  const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.16, 0.55), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  leftShoe.position.set(-0.3, -0.08, 0.12); playerGroup.add(leftShoe);
  const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.16, 0.55), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  rightShoe.position.set(0.3, -0.08, 0.12); playerGroup.add(rightShoe);
  scene.add(playerGroup);

  // --- VEHICLE CLASS (low poly car)---
  class Vehicle {
    constructor(x, z, color) {
      this.group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 2.1), new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 }));
      body.position.y = 0.2; body.castShadow = true;
      this.group.add(body);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.2), new THREE.MeshStandardMaterial({ color: 0x334455 }));
      roof.position.y = 0.55; this.group.add(roof);
      for (let i of [-0.7, 0.7]) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(i, 0.05, 0.8); this.group.add(wheel);
        const wheel2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        wheel2.rotation.z = Math.PI / 2;
        wheel2.position.set(i, 0.05, -0.8); this.group.add(wheel2);
      }
      this.group.position.set(x, 0, z);
      this.velocity = 0;
      this.angle = 0;
      scene.add(this.group);
    }
    getPos() { return this.group.position; }
    update(delta, controls) {
      let acc = 0;
      if (controls.forward) acc = 18;
      if (controls.backward) acc = -12;
      this.velocity += acc * delta;
      this.velocity *= 0.96;
      if (Math.abs(this.velocity) < 0.2) this.velocity = 0;
      let turn = controls.turn * 2.2 * (Math.abs(this.velocity) / 20);
      this.angle += turn * delta;
      this.group.rotation.y = this.angle;
      const forwardVec = new THREE.Vector3(-Math.sin(this.angle), 0, -Math.cos(this.angle));
      this.group.position.x += forwardVec.x * this.velocity * delta;
      this.group.position.z += forwardVec.z * this.velocity * delta;
      this.group.position.x = Math.min(95, Math.max(-95, this.group.position.x));
      this.group.position.z = Math.min(95, Math.max(-95, this.group.position.z));
    }
  }

  // --- ENEMY (Cartel)---
  class Enemy {
    constructor(x, z) {
      this.group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.6), new THREE.MeshStandardMaterial({ color: 0x8b3a2a }));
      body.position.y = 0.5; body.castShadow = true;
      this.group.add(body);
      const headE = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));
      headE.position.y = 1.05; this.group.add(headE);
      const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0xaa5533 }));
      hat.position.y = 1.27; this.group.add(hat);
      this.group.position.set(x, 0, z);
      this.health = 50;
      this.speed = 3.2;
      scene.add(this.group);
    }
    getPos() { return this.group.position; }
    takeDamage(dmg) {
      this.health -= dmg;
      if (this.health <= 0) {
        scene.remove(this.group);
        return true;
      }
      return false;
    }
    update(delta, playerPos) {
      const dir = new THREE.Vector3().subVectors(playerPos, this.group.position).normalize();
      this.group.position.x += dir.x * this.speed * delta;
      this.group.position.z += dir.z * this.speed * delta;
      this.group.lookAt(playerPos);
      // simple animation bounce
      this.group.position.y = Math.sin(Date.now() * 0.012) * 0.02;
    }
  }

  // --- GAME STATE ---
  const game = {
    playerPos: new THREE.Vector3(0, 0.5, 0),
    health: 100,
    maxHealth: 100,
    armor: 50,
    money: 8000,
    placosoCoins: 12,
    wanted: 1,
    killCount: 0,
    inVehicle: false,
    currentVehicle: null,
    weapon: { current: 'pistol', ammo: 30, lastShot: 0 },
    weaponsList: {
      pistol: { name: 'Pistol', maxAmmo: 30, damage: 38, fireRate: 0.35 },
      smg: { name: 'SMG', maxAmmo: 60, damage: 21, fireRate: 0.12 },
      ak: { name: 'AK47', maxAmmo: 45, damage: 42, fireRate: 0.18 }
    }
  };
  let enemies = [];
  let vehicles = [];

  // spawn start entities
  for (let i = 0; i < 4; i++) {
    let angle = Math.random() * Math.PI * 2;
    let dist = 15 + Math.random() * 25;
    let ex = Math.cos(angle) * dist;
    let ez = Math.sin(angle) * dist;
    enemies.push(new Enemy(ex, ez));
  }
  vehicles.push(new Vehicle(12, 18, 0xdd8844));
  vehicles.push(new Vehicle(-14, -12, 0x66aacc));
  vehicles.push(new Vehicle(5, -22, 0xcc6644));

  // --- INPUT ---
  const inputs = { forward: false, backward: false, left: false, right: false, shoot: false, enter: false, reload: false, sprint: false, aim: false };
  let mouseX = 0, mouseY = 0, pointerLock = false;
  let mobileJoystick = { x: 0, y: 0 };

  document.addEventListener('click', () => renderer.domElement.requestPointerLock());
  document.addEventListener('pointerlockchange', () => { pointerLock = document.pointerLockElement === renderer.domElement; });
  document.addEventListener('mousemove', (e) => {
    if (pointerLock) { mouseX += e.movementX * 0.0025; mouseY = Math.min(0.6, Math.max(-0.6, mouseY + e.movementY * 0.002)); }
  });
  document.addEventListener('mousedown', (e) => { if (e.button === 0 && pointerLock) inputs.shoot = true; });
  document.addEventListener('mouseup', () => { inputs.shoot = false; });
  window.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'KeyW': inputs.forward = true; break;
      case 'KeyS': inputs.backward = true; break;
      case 'KeyA': inputs.left = true; break;
      case 'KeyD': inputs.right = true; break;
      case 'ShiftLeft': inputs.sprint = true; break;
      case 'KeyE': inputs.enter = true; break;
      case 'KeyR': inputs.reload = true; break;
      case 'Space': inputs.shoot = true; break;
      case 'Digit1': game.weapon.current = 'pistol'; game.weapon.ammo = game.weaponsList.pistol.maxAmmo; updateWeaponUI(); break;
      case 'Digit2': game.weapon.current = 'smg'; game.weapon.ammo = game.weaponsList.smg.maxAmmo; updateWeaponUI(); break;
      case 'Digit3': game.weapon.current = 'ak'; game.weapon.ammo = game.weaponsList.ak.maxAmmo; updateWeaponUI(); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.code) {
      case 'KeyW': inputs.forward = false; break;
      case 'KeyS': inputs.backward = false; break;
      case 'KeyA': inputs.left = false; break;
      case 'KeyD': inputs.right = false; break;
      case 'ShiftLeft': inputs.sprint = false; break;
      case 'KeyE': inputs.enter = false; break;
      case 'KeyR': inputs.reload = false; break;
      case 'Space': inputs.shoot = false; break;
    }
  });

 
  function updateHealthUI() { document.getElementById('healthFill').style.width = (game.health / game.maxHealth * 100) + '%'; }
  function updateArmorUI() { document.getElementById('armorFill').style.width = game.armor + '%'; }
  function updateMoneyUI() { document.getElementById('moneyDisplay').innerHTML = `💰 ${Math.floor(game.money)}`; document.getElementById('coinDisplay').innerHTML = `🪙 PLACOSO: ${game.placosoCoins}`; }
  function updateWantedUI() { const filled = '⭐'.repeat(Math.min(5, game.wanted)); const empty = '☆'.repeat(5 - Math.min(5, game.wanted)); document.getElementById('wantedStars').innerHTML = filled + empty; }
  function updateWeaponUI() { const w = game.weaponsList[game.weapon.current]; document.getElementById('weaponName').innerHTML = w.name.toUpperCase(); document.getElementById('weaponAmmo').innerHTML = `${game.weapon.ammo}/${w.maxAmmo}`; }

  function shootRay() {
    const now = performance.now() / 1000;
    const w = game.weaponsList[game.weapon.current];
    if (now - game.weapon.lastShot < w.fireRate) return;
    if (game.weapon.ammo <= 0) return;
    game.weapon.lastShot = now;
    game.weapon.ammo--;
    updateWeaponUI();

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const origin = camera.position.clone();
    const raycaster = new THREE.Raycaster(origin, dir, 0, 70);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const box = new THREE.Box3().setFromObject(e.group);
      if (raycaster.ray.intersectsBox(box)) {
        const killed = e.takeDamage(w.damage);
        if (killed) {
          enemies.splice(i, 1);
          game.money += 550;
          game.placosoCoins += 1;
          game.killCount++;
          game.wanted = Math.min(5, Math.floor(game.killCount / 4) + 1);
          updateMoneyUI(); updateWantedUI();
          document.getElementById('missionText').innerHTML = `🔥 +550 pesos | CARTEL KILLS: ${game.killCount}`;
          setTimeout(() => { document.getElementById('missionText').innerHTML = '🏃 CJ · DRIVE / KILL / PLACOSO STORE'; }, 2000);
          if (enemies.length < 6 && Math.random() < 0.4) enemies.push(new Enemy((Math.random() - 0.5) * 45, (Math.random() - 0.5) * 45));
        }
        const cross = document.getElementById('crosshair');
        cross.style.transform = 'translate(-50%, -50%) scale(2)';
        cross.style.backgroundColor = '#ffaa44';
        setTimeout(() => { cross.style.transform = 'translate(-50%, -50%) scale(1)'; cross.style.backgroundColor = 'white'; }, 100);
        break;
      }
    }
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;top:50%;left:50%;width:90px;height:90px;background:radial-gradient(circle, #ffcc88, transparent);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:999';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 50);
  }

  function openStore() {
    const choice = confirm(`🏪 PLACOSO STUDIO 🏪\n💰 ${Math.floor(game.money)} pesos  🪙 ${game.placosoCoins} coins\n\n1. CLASSIC SHIRT - 800 pesos (+5 coins)\n2. SNAPBACK - 600 pesos (+3)\n3. GOLD HOODIE - 3500 pesos (+12)\n4. FULL ARMOR - 1200 pesos\n\nOK for item 1 | Cancel for item 4`);
    if (choice && game.money >= 800) {
      game.money -= 800; game.placosoCoins += 5; updateMoneyUI();
      alert('🎉 PLACOSO CLASSIC! +5 coins');
    } else if (!choice && game.money >= 1200) {
      game.money -= 1200; game.armor = Math.min(100, game.armor + 60); updateArmorUI(); updateMoneyUI();
      alert('🛡️ Full armor equipped!');
    } else alert('❌ Need more pesos! Kill cartel members.');
  }

  // Minimap
  const minimapCanvas = document.getElementById('minimapCanvas');
  const mCtx = minimapCanvas.getContext('2d');
  function updateMinimap() {
    mCtx.clearRect(0, 0, 170, 170);
    mCtx.fillStyle = '#1a2a2e';
    mCtx.fillRect(0, 0, 170, 170);
    const center = 85, scale = 2.1;
    vehicles.forEach(v => {
      let x = center + (v.getPos().x - game.playerPos.x) * scale;
      let y = center + (v.getPos().z - game.playerPos.z) * scale;
      if (x > 0 && x < 170 && y > 0 && y < 170) { mCtx.fillStyle = '#6c91b2'; mCtx.beginPath(); mCtx.arc(x, y, 3, 0, Math.PI * 2); mCtx.fill(); }
    });
    enemies.forEach(e => {
      let x = center + (e.getPos().x - game.playerPos.x) * scale;
      let y = center + (e.getPos().z - game.playerPos.z) * scale;
      if (x > 0 && x < 170 && y > 0 && y < 170) { mCtx.fillStyle = '#e34234'; mCtx.beginPath(); mCtx.arc(x, y, 4, 0, Math.PI * 2); mCtx.fill(); }
    });
    let sx = center + (storePos.x - game.playerPos.x) * scale;
    let sy = center + (storePos.z - game.playerPos.z) * scale;
    if (sx > 0 && sx < 170 && sy > 0 && sy < 170) { mCtx.fillStyle = '#ffcc44'; mCtx.fillRect(sx - 5, sy - 5, 10, 10); }
    mCtx.fillStyle = 'white'; mCtx.beginPath(); mCtx.moveTo(center, center - 9); mCtx.lineTo(center - 6, center + 5); mCtx.lineTo(center + 6, center + 5); mCtx.fill();
  }

  let lastTime = performance.now();
  let walkAnim = 0;

  function updateGame() {
    const now = performance.now();
    let delta = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    walkAnim += delta * 8;

    let moveX = 0, moveZ = 0;
    if (pointerLock || window.innerWidth > 768) {
      if (inputs.forward) moveZ -= 1;
      if (inputs.backward) moveZ += 1;
      if (inputs.left) moveX -= 1;
      if (inputs.right) moveX += 1;
    }

    const moving = (moveX !== 0 || moveZ !== 0) && !game.inVehicle;
    if (moving) {
      const swing = Math.sin(walkAnim) * 0.45;
      leftLeg.position.x = -0.3 + swing * 0.12; rightLeg.position.x = 0.3 - swing * 0.12;
      leftArm.rotation.z = Math.sin(walkAnim) * 0.6; rightArm.rotation.z = -0.35 + Math.sin(walkAnim) * 0.3;
      playerGroup.position.y = 0.5 + Math.abs(Math.sin(walkAnim * 14)) * 0.018;
    } else { leftLeg.position.x = -0.3; rightLeg.position.x = 0.3; leftArm.rotation.z = 0; rightArm.rotation.z = -0.35; playerGroup.position.y = 0.5; }

    if (!game.inVehicle) {
      const forward = new THREE.Vector3(-Math.sin(camera.rotation.y), 0, -Math.cos(camera.rotation.y));
      const right = new THREE.Vector3(Math.cos(camera.rotation.y), 0, -Math.sin(camera.rotation.y));
      if (moveZ) game.playerPos.addScaledVector(forward, moveZ * speed);
      if (moveX) game.playerPos.addScaledVector(right, moveX * speed);
      game.playerPos.x = Math.min(95, Math.max(-95, game.playerPos.x));
      game.playerPos.z = Math.min(95, Math.max(-95, game.playerPos.z));
      playerGroup.position.lerp(game.playerPos, 0.28);
      if (moving) playerGroup.rotation.y = camera.rotation.y + Math.atan2(moveX, moveZ);
      const offset = new THREE.Vector3(-Math.sin(camera.rotation.y) * (inputs.aim ? 4.2 : 5.6), 2.4, -Math.cos(camera.rotation.y) * (inputs.aim ? 4.2 : 5.6));
      camera.position.lerp(game.playerPos.clone().add(offset), 0.12);
    } else if (game.currentVehicle) {
      const vControls = { forward: inputs.forward, backward: inputs.backward, turn: (inputs.left ? -1 : inputs.right ? 1 : 0) };
      game.currentVehicle.update(delta, vControls);
      game.playerPos.copy(game.currentVehicle.getPos());
      playerGroup.position.copy(game.playerPos);
      playerGroup.visible = false;
      const vAngle = game.currentVehicle.angle;
      const camOff = new THREE.Vector3(-Math.sin(vAngle) * 8.5, 3.5, -Math.cos(vAngle) * 8.5);
      camera.position.lerp(game.playerPos.clone().add(camOff), 0.12);
      camera.lookAt(game.playerPos);
    } else { playerGroup.visible = true; }

    if (inputs.shoot && !game.inVehicle) shootRay();
    if (inputs.reload) { game.weapon.ammo = game.weaponsList[game.weapon.current].maxAmmo; updateWeaponUI(); inputs.reload = false; }

    let nearVehicle = vehicles.find(v => playerGroup.position.distanceTo(v.getPos()) < 2.8);
    if (inputs.enter && nearVehicle && !game.inVehicle) { game.inVehicle = true; game.currentVehicle = nearVehicle; playerGroup.visible = false; inputs.enter = false; }
    else if (inputs.enter && game.inVehicle) { game.inVehicle = false; game.currentVehicle = null; playerGroup.visible = true; inputs.enter = false; }

    if (playerGroup.position.distanceTo(storePos) < 2.5 && inputs.enter) { openStore(); inputs.enter = false; }

    enemies.forEach(e => e.update(delta, game.playerPos));
    updateMinimap();
    if (game.weapon.ammo === 0) { game.weapon.ammo = game.weaponsList[game.weapon.current].maxAmmo; updateWeaponUI(); }
    renderer.render(scene, camera);
    requestAnimationFrame(updateGame);
  }

  updateHealthUI(); updateArmorUI(); updateMoneyUI(); updateWeaponUI(); updateWantedUI();
  updateGame();
</script>





<script>
(() => {
  'use strict';

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ============================================================
     Virtual stick
     Emits { x, y, magnitude, active }
       x : -1 (left)  ->  +1 (right)
       y : -1 (down)  ->  +1 (up)
     ============================================================ */
  class Stick {
    constructor(root, opts = {}) {
      this.root      = root;
      this.knob      = root.querySelector('.knob');
      this.onChange  = opts.onChange || (() => {});
      this.deadzone  = opts.deadzone ?? 0.12;
      this.invertY   = opts.invertY  ?? false;
      this.pointerId = null;
      this.maxDist   = 40;
      this.center    = { x: 0, y: 0 };
      this.value     = { x: 0, y: 0, magnitude: 0, active: false };

      root.addEventListener('pointerdown',   e => this._onDown(e));
      root.addEventListener('pointermove',   e => this._onMove(e));
      root.addEventListener('pointerup',     e => this._onUp(e));
      root.addEventListener('pointercancel', e => this._onUp(e));
      root.addEventListener('lostpointercapture', e => {
        if (e.pointerId === this.pointerId) this.reset();
      });
      root.addEventListener('contextmenu', e => e.preventDefault());
    }

    _onDown(e) {
      if (this.pointerId !== null) return;          // already owned by another finger
      e.preventDefault();
      this.pointerId = e.pointerId;
      try { this.root.setPointerCapture(e.pointerId); } catch {}

      const r = this.root.getBoundingClientRect();
      this.center = { x: r.left + r.width / 2, y: r.top + r.height / 2 };

      const knobR = this.knob.getBoundingClientRect().width / 2;
      this.maxDist = Math.max(10, r.width / 2 - knobR);

      this.root.classList.add('active');
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }

      this._update(e.clientX, e.clientY);
    }

    _onMove(e) {
      if (e.pointerId !== this.pointerId) return;
      e.preventDefault();
      this._update(e.clientX, e.clientY);
    }

    _onUp(e) {
      if (e.pointerId !== this.pointerId) return;
      this.reset();
    }

    _update(clientX, clientY) {
      let dx = clientX - this.center.x;
      let dy = clientY - this.center.y;

      // clamp travel to the pad radius
      const dist = Math.hypot(dx, dy);
      if (dist > this.maxDist) {
        const k = this.maxDist / dist;
        dx *= k; dy *= k;
      }
      this._moveKnob(dx, dy);

      // normalise: screen-up  =>  +y
      let nx =  dx / this.maxDist;
      let ny = -dy / this.maxDist;
      if (this.invertY) ny = -ny;

      // dead zone + rescale so output is continuous from 0..1
      const mag = Math.hypot(nx, ny);
      if (mag < this.deadzone) {
        nx = 0; ny = 0;
      } else {
        const scaled = (mag - this.deadzone) / (1 - this.deadzone);
        nx = (nx / mag) * scaled;
        ny = (ny / mag) * scaled;
      }

      this.value = { x: nx, y: ny, magnitude: Math.hypot(nx, ny), active: true };
      this.onChange(this.value);
    }

    _moveKnob(dx, dy) {
      this.knob.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
    }

    reset() {
      if (this.pointerId !== null) {
        try { this.root.releasePointerCapture(this.pointerId); } catch {}
      }
      this.pointerId = null;
      this.root.classList.remove('active');
      this._moveKnob(0, 0);
      this.value = { x: 0, y: 0, magnitude: 0, active: false };
      this.onChange(this.value);
    }
  }

  /* ============================================================
     Instantiate the two sticks
     ============================================================ */
  const moveStick = new Stick(document.getElementById('movePad'), { deadzone: 0.15 });
  const lookStick = new Stick(document.getElementById('lookPad'), { deadzone: 0.08 });

  // Raw input, updated by the sticks
  const input = {
    moveX: 0, moveY: 0,   // strafe, forward
    lookX: 0, lookY: 0    // yaw,    pitch
  };

  moveStick.onChange = v => { input.moveX = v.x; input.moveY = v.y; };
  lookStick.onChange = v => { input.lookX = v.x; input.lookY = v.y; };

  /* ============================================================
     Desktop keyboard fallback (WASD + arrows)
     ============================================================ */
  const keys = new Set();
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); moveStick.reset(); lookStick.reset(); });

  function keyboard() {
    const k = c => keys.has(c) ? 1 : 0;
    return {
      mx: k('KeyD') - k('KeyA'),
      my: k('KeyW') - k('KeyS'),
      lx: k('ArrowRight') - k('ArrowLeft'),
      ly: k('ArrowUp')    - k('ArrowDown')
    };
  }

  /* ============================================================
     DEMO CONSUMER
     Replace this block with your engine's input handling
     (three.js / Unity WebGL / Unreal / custom renderer...)
     ============================================================ */
  const LOOK_SPEED = 2.6;   // rad / sec at full deflection
  const MOVE_SPEED = 3.2;   // units / sec at full deflection

  const player = { yaw: 0, pitch: 0, x: 0, z: 0 };
  const hud = document.getElementById('hud');

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // merge stick + keyboard (stick wins when deflected)
    const kb = keyboard();
    const mx = moveStick.value.magnitude > 0 ? input.moveX : kb.mx;
    const my = moveStick.value.magnitude > 0 ? input.moveY : kb.my;
    const lx = lookStick.value.magnitude > 0 ? input.lookX : kb.lx;
    const ly = lookStick.value.magnitude > 0 ? input.lookY : kb.ly;

    /* ---- LOOK (rate based) ---- */
    player.yaw   -= lx * LOOK_SPEED * dt;                        // right = turn right
    player.pitch += ly * LOOK_SPEED * dt;                        // up    = look up
    player.pitch  = clamp(player.pitch, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);

    /* ---- MOVE (relative to facing) ---- */
    const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
    const fwdX = -s, fwdZ = -c;   // forward
    const rgtX =  c, rgtZ = -s;   // right

    player.x += (rgtX * mx + fwdX * my) * MOVE_SPEED * dt;
    player.z += (rgtZ * mx + fwdZ * my) * MOVE_SPEED * dt;

    /* ---- HUD ---- */
    const deg = r => (r * 180 / Math.PI).toFixed(0).padStart(4, ' ');
    hud.textContent =
      `MOVE  x ${mx.toFixed(2).padStart(5)}   y ${my.toFixed(2).padStart(5)}\n` +
      `LOOK  x ${lx.toFixed(2).padStart(5)}   y ${ly.toFixed(2).padStart(5)}\n` +
      `YAW ${deg(player.yaw)}°   PITCH ${deg(player.pitch)}°\n` +
      `POS  ${player.x.toFixed(1)}, ${player.z.toFixed(1)}`;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
